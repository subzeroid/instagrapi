name: Anonymous password key validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encryption-key:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHON_DOTENV_DISABLED: "1"
      TEST_ACCOUNTS_URL: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2585852a080856a6155df582728e5944e03aec0a
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the exact candidate
        run: python -m pip install --disable-pip-version-check . "curl_cffi==0.15.0"
      - name: One anonymous launcher request
        run: |
          python - <<'PY'
          import os,sys,json,time,logging,base64,hashlib,subprocess
          from pathlib import Path
          from urllib.parse import urlparse,parse_qs
          ROOT=Path.cwd()
          WORK=ROOT
          for k in list(os.environ):
           if k.upper().endswith('_PROXY') or k in ['CURL_CA_BUNDLE','REQUESTS_CA_BUNDLE','SSL_CERT_FILE','SSL_CERT_DIR','SSLKEYLOGFILE']:os.environ.pop(k,None)
          os.environ['PYTHON_DOTENV_DISABLED']='1';os.environ['TEST_ACCOUNTS_URL']=''
          sys.path.insert(0,str(WORK));logging.disable(logging.CRITICAL)
          from instagrapi import Client
          from Cryptodome.PublicKey import RSA
          class BudgetStop(Exception):pass
          client=Client(with_challenge_flow=False,session_retry_total=0,session_retry_statuses=[],public_request_retries_count=0,request_timeout=0)
          client.private.trust_env=False;client.public.trust_env=False;client.graphql.trust_env=False
          assert not client.username and not client.password and not client.user_id and not client.authorization
          assert 'sessionid' not in client.private.cookies
          expected='2585852a080856a6155df582728e5944e03aec0a';commit=subprocess.check_output(['git','rev-parse','HEAD'],cwd=WORK,text=True).strip();assert commit==expected
          result={'commit':commit,'target':'https://i.instagram.com/api/v1/launcher/sync/','method':'POST','authentication_present':False,'password_sent':False,'provider_calls':0,'requests':0,'retries':0,'pass':False}
          post=client.private.post
          client.private.get=lambda *a,**k: (_ for _ in ()).throw(BudgetStop('GET outside scope'))
          client.public.get=client.private.get;client.public.post=client.private.get;client.graphql.get=client.private.get;client.graphql.post=client.private.get
          started=time.monotonic()
          def guarded_post(url,**kwargs):
           if result['requests'] or url!=result['target']:raise BudgetStop('Request budget or target exceeded')
           signed=parse_qs(kwargs['data'])['signed_body'];assert len(signed)==1
           payload=json.loads(signed[0].split('.',1)[1]);assert set(payload)=={'id','server_config_retrieval'} and payload['server_config_retrieval']=='1'
           result['payload_fields']=sorted(payload);result['requests']+=1
           kwargs.update(timeout=(5,10),allow_redirects=False,verify=True)
           response=post(url,**kwargs)
           result['http_status']=response.status_code;result['key_id_header_present']=bool(response.headers.get('ig-set-password-encryption-key-id'));result['public_key_header_present']=bool(response.headers.get('ig-set-password-encryption-pub-key'))
           text=response.content.lower();restricted=response.status_code==429 or any(x in text for x in [b'challenge_required',b'checkpoint_required',b'please wait a few minutes'])
           result['restriction_detected']=restricted
           if restricted:raise BudgetStop('Restricted response; no further request permitted')
           return response
          client.private.post=guarded_post
          try:
           key_id,key=client.password_publickeys();decoded=base64.b64decode(key,validate=True);rsa=RSA.import_key(decoded)
           assert 0<=key_id<=255 and rsa.size_in_bits()>=2048 and not rsa.has_private()
           result.update({'key_id':key_id,'rsa_bits':rsa.size_in_bits(),'public_key_sha256':hashlib.sha256(decoded).hexdigest(),'pass':True})
          except Exception as error:
           result['exception']=type(error).__name__
          finally:
           for session in (client.private,client.public,client.graphql):session.close()
           result['seconds']=round(time.monotonic()-started,3);result['sessions_closed']=True
           (ROOT/'live-key-result.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result))
          raise SystemExit(0 if result['pass'] else 1)
          PY
