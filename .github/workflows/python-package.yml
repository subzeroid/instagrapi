# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Package

on:
  push:
    branches: [ "master" ]
  pull_request: {}

env:
  PYTHON_VERSION: "3.13.5"

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          test: "true"

      - name: Run bandit
        run: bandit -c pyproject.toml -r instagrapi

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          test: "true"

      - name: Run Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

  minimum-runtime-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install package with minimum runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "curl_cffi==0.15.0" \
            "requests==2.34.2" \
            "PySocks==1.7.1" \
            "pydantic==2.12.5" \
            "Pillow==12.2.0" \
            "pycryptodomex==3.23.0"
          python -m pip install .
          python -m pip check
          python - <<'PY'
          from instagrapi import Client

          assert Client().private_transport == "curl"
          PY

  test-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          test: "true"
      - name: Run full offline regression suite
        env:
          PYTHON_DOTENV_DISABLED: "1"
          TEST_ACCOUNTS_URL: ""
        run: pytest -q tests/regression

  default-install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify a clean standard installation
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          environment = Path(".default-install").resolve()
          subprocess.run([sys.executable, "-m", "venv", str(environment)], check=True)
          python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          subprocess.run([str(python), "-m", "pip", "install", "."], check=True)
          subprocess.run([str(python), "-m", "pip", "check"], check=True)
          code = """
          import importlib.util
          from instagrapi import Client

          assert importlib.util.find_spec("h2") is None
          assert importlib.util.find_spec("curl_adapter") is None
          client = Client()
          assert client.private_transport == "curl"
          assert callable(client.login_legacy)
          print(type(client.private).__name__, client.private_transport)
          """
          subprocess.run([str(python), "-c", code], cwd=environment, check=True)
          PY

  test-curl-transport:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.14" ]
        curl-cffi: [ "curl_cffi==0.15.0", "curl_cffi" ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install standard package and wire test dependencies
        run: python -m pip install . "${{ matrix.curl-cffi }}" pytest "h2>=4.3,<5" "cryptography>=46,<47"
      - name: Verify dependencies and run real TLS/HTTP2 tests
        run: |
          python -c "import curl_cffi, h2, cryptography"
          pytest -q tests/regression/test_default_transport.py tests/regression/test_private_transport.py tests/regression/test_private_transport_wire.py

  build-docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          test: "true"

      - name: Build Docs
        run: mkdocs build --strict

      # upload artifact for dev build
      - name: Upload coverage results artifact
        if: github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/

  update-dev-docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          test: "true"

      - name: Push documentation changes
        uses: ./.github/actions/publish-docs-with-mike
        with:
          version_name: dev
